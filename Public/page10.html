<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Last Question ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="floating-hearts">
    <span>❤️</span>
    <span>💕</span>
    <span>💗</span>
    <span>💖</span>
    <span>💘</span>
</div>


<main class="page">

    <div class="card">

        <div class="heart-icon">
            ❤️
        </div>

        <p class="small-text">
            Bas ek last question...
        </p>

        <h1>
            Sach Sach<br>
            <span>Batana ❤️</span>
        </h1>

        <p class="note">
            Ab tak tumne mera little experience
            complete kiya hai... 💌
        </p>

        <p class="note">
            Toh last mein ek honest answer chahiye. ❤️
        </p>


        <!-- FINAL OPTIONS -->

        <div class="options">

            <button onclick="selectAnswer('Yes ❤️')">
                ❤️ Yes
            </button>

            <button onclick="selectAnswer('Maybe 😌')">
                😌 Maybe
            </button>

            <button onclick="selectAnswer('Let me think 🤭')">
                🤭 Let me think
            </button>

        </div>


        <!-- SELECTED ANSWER -->

        <p id="selected"></p>


        <!-- MESSAGE -->

        <div id="messageBox" style="display:none;">

            <p class="note">
                Aur kuch kehna chahti ho toh
                yahan likh sakti ho. 💌
            </p>

            <textarea
                id="message"
                placeholder="Jo dil mein ho, likh do..."
                rows="5"
            ></textarea>


            <button onclick="submitForm()">
                ❤️ Submit
            </button>

        </div>


        <!-- STATUS -->

        <p id="status"></p>


        <p class="creator">
            Made with ❤️ by <strong>Piyush</strong>
        </p>

    </div>

</main>


<script>

let finalAnswer = "";


/* =========================
   SELECT FINAL ANSWER
========================= */

function selectAnswer(answer) {

    finalAnswer = answer;

    sessionStorage.setItem(
        "answer2",
        answer
    );

    document.getElementById("selected").innerText =
        "Your answer: " + answer + " ❤️";

    document.getElementById("messageBox").style.display =
        "block";
}


/* =========================
   SUBMIT FORM
========================= */

async function submitForm() {

    const message =
        document.getElementById("message").value.trim();

    const status =
        document.getElementById("status");


    /* =========================
       GET SAVED INFORMATION
    ========================= */

    const name =
        sessionStorage.getItem("userName") || "Special Guest";

    const phone =
        sessionStorage.getItem("userPhone") || "Not provided";

    const latitude =
        sessionStorage.getItem("latitude");

    const longitude =
        sessionStorage.getItem("longitude");

    const answer1 =
        sessionStorage.getItem("answer1") || "Walking & Talking ❤️";

    const answer2 =
        sessionStorage.getItem("answer2") || finalAnswer;


    /* =========================
       CHECK REQUIRED DATA
    ========================= */

    if (!answer2) {

        status.innerText =
            "Please final question ka answer select karo ❤️";

        return;
    }


    /* =========================
       SHOW SUBMITTING
    ========================= */

    status.innerText =
        "Submitting... ❤️";


    /* =========================
       DATA
    ========================= */

    const safeLatitude = (latitude && !isNaN(Number(latitude))) ? Number(latitude) : null;
    const safeLongitude = (longitude && !isNaN(Number(longitude))) ? Number(longitude) : null;

    const data = {

        name: name,

        phone: phone,

        latitude: safeLatitude,

        longitude: safeLongitude,

        answer1: answer1,

        answer2: answer2,

        message: message

    };


    console.log(
        "Sending data:",
        data
    );


    /* =========================
       DETERMINE API URL
    ========================= */

    let apiUrl = "/api/responses";

    if (window.location.protocol === "file:") {
        apiUrl = "http://localhost:3000/api/responses";
    } else if (window.location.port && window.location.port !== "3000") {
        apiUrl = `${window.location.protocol}//${window.location.hostname}:3000/api/responses`;
    }


    /* =========================
       SEND TO SERVER
    ========================= */

    try {

        const response = await fetch(
            apiUrl,
            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)

            }
        );


        const result =
            await response.json();


        console.log(
            "Server response:",
            result
        );


        /* =========================
           SUCCESS
        ========================= */

        if (response.ok) {

            status.innerText =
                "Thank you ❤️ Your response has been submitted!";


            /*
             * Wait 1 second
             * then open final page
             */

            setTimeout(function () {

                sessionStorage.clear();

                window.location.href =
                    "page11.html";

            }, 1000);

        }


        /* =========================
           SERVER ERROR
        ========================= */

        else {

            status.innerText =
                result.message ||
                "Something went wrong. Please try again.";

        }

    }


    /* =========================
       CONNECTION ERROR
    ========================= */

    catch (error) {

        console.error(
            "Submit error:",
            error
        );

        status.innerText =
            "Server se connection nahi ho raha. Make sure server is running on port 3000.";

    }

}

</script>

</body>

</html>
