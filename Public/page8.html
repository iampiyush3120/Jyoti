<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ek Aur Tasveer ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="floating-hearts">
        <span>❤️</span>
        <span>💕</span>
        <span>💗</span>
        <span>💖</span>
        <span>💘</span>
    </div>

    <main class="page">

        <div class="card photo-card">

            <div class="heart-icon">
                📸
            </div>

            <p class="small-text">
                Ek aur chhoti si memory... ❤️
            </p>

            <h1>
                Ek Aur<br>
                <span>Tasveer ❤️</span>
            </h1>

            <div class="photo-wrapper">

                <img
                    src="images/photo3.jpg"
                    alt="A special memory"
                    class="special-photo"
                >

            </div>

            <div class="personal-note">

                <p>
                    Kuch tasveerein bas dekhne ke liye nahi hoti...
                    unhe dekhkar ek alag si smile aa jaati hai. ❤️
                </p>

                <p>
                    Shayad ye bhi unhi mein se ek hai. 💌
                </p>

            </div>

            <button id="nextButton">
                Thoda Aur Aage? ❤️
            </button>

            <p class="creator">
                Made with ❤️ by <strong>Piyush</strong>
            </p>

        </div>

    </main>


    <!-- ========================= -->
    <!-- SONG 4 -->
    <!-- ========================= -->

    <audio id="pageMusic" loop preload="auto">
        <source src="music/song4.mp3" type="audio/mpeg">
    </audio>


    <script>

        const music = document.getElementById("pageMusic");
        const nextButton = document.getElementById("nextButton");


        // Volume
        music.volume = 1.0;


        // Music play function
        function playMusic() {

            music.play()
                .then(function () {

                    console.log("Song 4 playing ❤️");

                })
                .catch(function (error) {

                    console.log(
                        "Autoplay blocked:",
                        error
                    );

                });

        }


        // Page open hote hi music play karne ki try
        playMusic();


        // User page par click kare to dobara play try
        document.addEventListener(
            "click",
            function () {

                playMusic();

            }
        );


        // Next Page
        nextButton.addEventListener(
            "click",
            function () {

                window.location.href = "page9.html";

            }
        );

    </script>

</body>

</html>
